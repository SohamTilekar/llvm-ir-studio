[workspace]
resolver = "2"
members = [
    "crates/ir-core",
    "crates/ir-version",
    "crates/ir-analysis",
    "crates/ir-docs",
    "crates/ir-viz",
    "crates/ir-lsp",
    "crates/llvm-ir-ls",
]

[workspace.dependencies]
ir-core = { path = "crates/ir-core" }
ir-version = { path = "crates/ir-version" }
ir-analysis = { path = "crates/ir-analysis" }
ir-docs = { path = "crates/ir-docs" }
ir-viz = { path = "crates/ir-viz" }
ir-lsp = { path = "crates/ir-lsp" }

tree-sitter = "0.25.10"
tree-sitter-llvm = "1.1.0"
tower-lsp = "0.20.0"
tokio = { version = "1.54.1", features = ["full"] }
ropey = "1.6.1"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
