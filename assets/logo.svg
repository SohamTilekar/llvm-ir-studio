<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Dragon Fire Gradient -->
    <linearGradient id="dragonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d81b60"/>
      <stop offset="35%" stop-color="#ff3d00"/>
      <stop offset="70%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffea00"/>
    </linearGradient>

    <!-- Cyan Dataflow Gradient -->
    <linearGradient id="cyanFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </linearGradient>

    <!-- Emerald Success Flow -->
    <linearGradient id="emeraldFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#253248" stroke-width="3"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="url(#cyanFlow)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Background Grid Pattern (Compiler Matrix) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="472"/>
    <line x1="160" y1="40" x2="160" y2="472"/>
    <line x1="240" y1="40" x2="240" y2="472"/>
    <line x1="320" y1="40" x2="320" y2="472"/>
    <line x1="400" y1="40" x2="400" y2="472"/>
    <line x1="40" y1="80" x2="472" y2="80"/>
    <line x1="40" y1="160" x2="472" y2="160"/>
    <line x1="40" y1="240" x2="472" y2="240"/>
    <line x1="40" y1="320" x2="472" y2="320"/>
    <line x1="40" y1="400" x2="472" y2="400"/>
  </g>

  <!-- CFG Directed Flow Graph Edges (Background Layer) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Branch from Root Node (256, 120) to Left Block (150, 230) -->
    <path d="M 230 145 L 165 205" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.7" stroke-dasharray="6 4"/>
    <!-- Branch from Root Node (256, 120) to Right Block (362, 230) -->
    <path d="M 282 145 L 345 205" stroke="#ff9100" stroke-width="3" stroke-opacity="0.7"/>
    <!-- Left to Join (256, 385) -->
    <path d="M 165 275 L 235 365" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.8"/>
    <!-- Right to Join (256, 385) -->
    <path d="M 345 275 L 277 365" stroke="#ff3d00" stroke-width="3" stroke-opacity="0.8"/>
  </g>

  <!-- Central LLVM Dragon Stylized Silhouette (Faceted Poly / Modern Emblem) -->
  <g filter="url(#subtleGlow)">
    <!-- Dragon Wing Upper Span Left -->
    <polygon points="256,90 190,140 135,100 170,165 110,185 180,210" fill="url(#dragonGrad)" opacity="0.95"/>
    <!-- Dragon Wing Upper Span Right -->
    <polygon points="256,90 322,140 377,100 342,165 402,185 332,210" fill="url(#dragonGrad)" opacity="0.95"/>
    
    <!-- Dragon Head & Spire Crest -->
    <polygon points="256,70 240,110 256,128 272,110" fill="#fff" opacity="0.9"/>
    <polygon points="256,70 246,95 256,105 266,95" fill="#ffea00"/>

    <!-- Central Body Core & SSA Diamond -->
    <polygon points="256,135 200,215 256,285 312,215" fill="#141a29" stroke="url(#dragonGrad)" stroke-width="4"/>
    <polygon points="256,155 218,215 256,268 294,215" fill="url(#dragonGrad)" opacity="0.85"/>
    
    <!-- Inner Core Symbol (%) -->
    <text x="256" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#subtleGlow)">%</text>

    <!-- Lower Dragon Tail / Flame Spires -->
    <polygon points="256,290 238,340 256,360 274,340" fill="url(#dragonGrad)"/>
    <polygon points="256,365 246,400 256,415 266,400" fill="#ff3d00"/>
  </g>

  <!-- Interactive CFG Nodes (Representing Basic Blocks & Instructions) -->
  <!-- Top Root Node (entry) -->
  <g filter="url(#glow)">
    <rect x="216" y="105" width="80" height="34" rx="8" fill="#101826" stroke="#00e5ff" stroke-width="2.5"/>
    <circle cx="230" cy="122" r="4" fill="#00e5ff"/>
    <text x="260" y="127" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#e0f7fa">entry</text>
  </g>

  <!-- Left Block (then / if.true) -->
  <g filter="url(#glow)">
    <rect x="100" y="215" width="94" height="48" rx="10" fill="#0f1f2c" stroke="#00e676" stroke-width="2"/>
    <circle cx="118" cy="233" r="4" fill="#00e676"/>
    <text x="130" y="236" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#b9f6ca">then:</text>
    <text x="118" y="252" font-family="'JetBrains Mono', monospace" font-size="10" fill="#80cbc4">add i32</text>
  </g>

  <!-- Right Block (else / if.false) -->
  <g filter="url(#glow)">
    <rect x="318" y="215" width="94" height="48" rx="10" fill="#26161c" stroke="#ff3d00" stroke-width="2"/>
    <circle cx="336" cy="233" r="4" fill="#ff3d00"/>
    <text x="348" y="236" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffccbc">else:</text>
    <text x="336" y="252" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffab91">sub i32</text>
  </g>

  <!-- Bottom Join Block (phi / return) -->
  <g filter="url(#glow)">
    <rect x="206" y="360" width="100" height="48" rx="10" fill="#151b2d" stroke="#2979ff" stroke-width="2"/>
    <circle cx="224" cy="378" r="4" fill="#2979ff"/>
    <text x="236" y="381" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#bbdefb">return:</text>
    <text x="224" y="397" font-family="'JetBrains Mono', monospace" font-size="10" fill="#90caf9">ret i32 %r</text>
  </g>

  <!-- Corner Brackets (Code / Studio Framing) -->
  <g stroke="#384964" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 64 88 L 64 64 L 88 64"/>
    <path d="M 448 88 L 448 64 L 424 64"/>
    <path d="M 64 424 L 64 448 L 88 448"/>
    <path d="M 448 424 L 448 448 L 424 448"/>
  </g>
</svg>