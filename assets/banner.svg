<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0e131d"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d00"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffea00"/>
    </linearGradient>

    <linearGradient id="dragonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d81b60"/>
      <stop offset="35%" stop-color="#ff3d00"/>
      <stop offset="70%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ffea00"/>
    </linearGradient>

    <linearGradient id="cyanFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="halo" cx="18%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ff3d00" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="20" fill="url(#halo)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#232f42" stroke-width="2"/>

  <!-- Subtle Matrix Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- Left Icon Emblem (220x220 container at x=50, y=50) -->
  <g transform="translate(50, 50)">
    <!-- Squircle Base -->
    <rect x="0" y="0" width="220" height="220" rx="50" fill="#131a27" stroke="#25354d" stroke-width="2"/>
    <rect x="1" y="1" width="218" height="218" rx="49" fill="none" stroke="url(#cyanFlow)" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- CFG Flow Lines -->
    <path d="M 100 65 L 65 105" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.8" stroke-dasharray="4 3"/>
    <path d="M 120 65 L 155 105" stroke="#ff9100" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M 65 130 L 100 170" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M 155 130 L 120 170" stroke="#ff3d00" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Dragon Wings & Head -->
    <polygon points="110,40 80,65 55,45 70,78 45,88 75,100" fill="url(#dragonGrad)"/>
    <polygon points="110,40 140,65 165,45 150,78 175,88 145,100" fill="url(#dragonGrad)"/>
    <polygon points="110,30 102,50 110,58 118,50" fill="#ffea00"/>

    <!-- SSA Diamond Core -->
    <polygon points="110,65 82,105 110,140 138,105" fill="#151b29" stroke="url(#dragonGrad)" stroke-width="3"/>
    <polygon points="110,75 92,105 110,132 128,105" fill="url(#dragonGrad)" opacity="0.8"/>
    <text x="110" y="111" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">%</text>

    <!-- CFG Mini Nodes -->
    <rect x="90" y="52" width="40" height="18" rx="4" fill="#0f1724" stroke="#00e5ff" stroke-width="1.5"/>
    <rect x="42" y="105" width="46" height="24" rx="5" fill="#0e231c" stroke="#00e676" stroke-width="1.5"/>
    <rect x="132" y="105" width="46" height="24" rx="5" fill="#281418" stroke="#ff3d00" stroke-width="1.5"/>
    <rect x="88" y="165" width="44" height="20" rx="5" fill="#141a2e" stroke="#2979ff" stroke-width="1.5"/>
  </g>

  <!-- Right Typography & Branding -->
  <g transform="translate(310, 55)">
    <!-- Overline Badge -->
    <rect x="0" y="0" width="168" height="24" rx="12" fill="#ff3d00" fill-opacity="0.12" stroke="#ff3d00" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#00e676"/>
    <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff9100" letter-spacing="1.2">NATIVE COMPILER TOOLING</text>

    <!-- Main Title -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">LLVM IR STUDIO</text>
    <text x="430" y="68" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="500" fill="#8b949e">llvm-ir-ls</text>

    <!-- Subtitle -->
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#c9d1d9">
      Lightweight, Version-Aware LLVM IR Language Server &amp; Interactive CFG Visualizer in Rust
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 130)">
      <!-- Rust Badge -->
      <g transform="translate(0, 0)">
        <rect width="150" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f0883e">🦀 Pure Rust (No C++)</text>
      </g>

      <!-- LLVM Version Badge -->
      <g transform="translate(160, 0)">
        <rect width="145" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#58a6ff">⚡ LLVM 14 - 21+</text>
      </g>

      <!-- CFG Visualizer Badge -->
      <g transform="translate(315, 0)">
        <rect width="180" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#3fb950">📊 Interactive CFG Webview</text>
      </g>

      <!-- SSA Def-Use Badge -->
      <g transform="translate(505, 0)">
        <rect width="150" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#bc8cff">🔍 SSA Def-Use &amp; Rename</text>
      </g>

      <!-- Editors Row -->
      <g transform="translate(665, 0)">
        <rect width="175" height="32" rx="8" fill="#1c2128" stroke="#388bfd" stroke-opacity="0.4"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#79c0ff">VS Code • Zed • Neovim</text>
      </g>
    </g>

    <!-- Tech specs bar -->
    <text x="0" y="195" font-family="'JetBrains Mono', monospace" font-size="12" fill="#586069">
      Tree-sitter Syntax Engine • Zero Memory Leaks • Instant Startup (&lt;10ms) • Full LSP Diagnostics
    </text>
  </g>
</svg>