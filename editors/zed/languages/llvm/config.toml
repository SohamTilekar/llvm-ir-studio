name = "LLVM"
grammar = "llvm"
path_suffixes = ["ll"]
line_comments = ["; "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
]
